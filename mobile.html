<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CardVault Pro — Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { 
    --bg: #000000; 
    --bg-elevated: #121212;
    --surface: #1C1C1E; 
    --surface-hover: #2C2C2E;
    --border: rgba(255,255,255,0.08); 
    --border-light: rgba(255,255,255,0.15);
    --gold: #D4AF37; 
    --gold-dim: rgba(212,175,55,0.15); 
    --gold-glow: rgba(212,175,55,0.4);
    --text: #FFFFFF; 
    --sub: #EBEBF599; 
    --muted: #EBEBF54D; 
    --danger: #FF453A; 
    --navh: 84px; 
  }
  
  /* ── Native Reset & Base ── */
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { height:100%; width:100%; background:var(--bg); color:var(--text); font-family:'Pretendard', sans-serif; overflow-x:hidden; overscroll-behavior-y:none; }
  body { padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom, 20px)); }
  input, button, select { font-family:inherit; }

  /* ── iOS Style Header ── */
  .hdr { position:sticky; top:0; z-index:100; background:rgba(0,0,0,0.8); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-bottom:0.5px solid var(--border); padding-top:env(safe-area-inset-top, 0px); }
  .hdr-top { display:flex; align-items:center; justify-content:space-between; padding:12px 20px 8px; }
  .brand-name { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; font-style:italic; background:linear-gradient(135deg, #FFF, var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:0.5px;}
  .hdr-acts { display:flex; align-items:center; gap:12px; }
  .count-pill { font-size:12px; font-weight:600; color:var(--sub); background:var(--surface); padding:6px 12px; border-radius:99px; border:0.5px solid var(--border);}
  .count-pill b { color:var(--gold); }
  .set-btn { width:36px; height:36px; border-radius:50%; background:var(--surface); color:var(--text); border:0.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:18px; transition:transform 0.1s; }
  .set-btn:active { transform:scale(0.92); background:var(--surface-hover); }

  /* ── Search & Filter ── */
  .search-row { padding:4px 20px 12px; }
  .search-box { position:relative; display:flex; align-items:center; background:var(--surface); border-radius:12px; padding:0 14px; height:40px; transition:background 0.2s; border:0.5px solid transparent; }
  .search-box:focus-within { background:var(--bg-elevated); border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-dim); }
  .search-ic { font-size:15px; color:var(--muted); margin-right:8px; }
  .search-box input { flex:1; background:transparent; border:none; color:var(--text); font-size:15px; height:100%; outline:none; }
  .search-box input::placeholder { color:var(--muted); }

  .filter-chips { display:flex; gap:8px; padding:0 20px 12px; overflow-x:auto; scrollbar-width:none; }
  .filter-chips::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; height:32px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; border-radius:99px; font-size:13px; font-weight:600; background:var(--surface); color:var(--sub); border:0.5px solid transparent; transition:all 0.2s; }
  .chip.on { background:var(--gold-dim); color:var(--gold); border-color:var(--gold); }
  
  .consonant-bar { display:flex; gap:6px; padding:0 20px 16px; overflow-x:auto; scrollbar-width:none; border-bottom:0.5px solid var(--border); margin-bottom:16px; }
  .consonant-bar::-webkit-scrollbar { display:none; }
  .c-btn { flex-shrink:0; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:13px; font-weight:600; background:transparent; border:0.5px solid var(--border); color:var(--sub); transition:all 0.2s; }
  .c-btn.on { background:var(--gold); color:#000; border-color:var(--gold); box-shadow:0 2px 8px var(--gold-dim); }

  /* ── List View Cards (UI 전면 개편) ── */
  #app { padding:0 20px 20px; display:flex; flex-direction:column; gap:16px; position:relative; z-index:1; }
  .card { background:var(--bg-elevated); border-radius:20px; overflow:hidden; position:relative; display:flex; flex-direction:column; border:0.5px solid var(--border); transition:transform 0.15s, opacity 0.3s; }
  .card:active { transform:scale(0.97); background:var(--surface); }
  
  .status-badge { position:absolute; top:12px; left:12px; font-size:10px; font-weight:700; padding:4px 8px; border-radius:8px; z-index:5; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .badge-new { background:rgba(48,209,88,0.2); color:#30D158; border:0.5px solid rgba(48,209,88,0.3); }
  .badge-change { background:rgba(191,90,242,0.2); color:#BF5AF2; border:0.5px solid rgba(191,90,242,0.3); }
  .badge-update { background:rgba(10,132,255,0.2); color:#0A84FF; border:0.5px solid rgba(10,132,255,0.3); }
  
  /* 배너 높이를 확 줄여서 콤팩트하게 만듭니다 */
  .card-banner { width:100%; height:80px; position:relative; overflow:hidden; background:var(--surface); }
  .card-banner img { width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 0.4s ease; }
  .card-banner img.loaded { opacity:1; }
  .card-banner::after { content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%); pointer-events:none; }
  
  /* 이미지가 없을 때의 모던한 SVG 모노그램 패턴 */
  .card-banner-default { width:100%; height:100%; min-height:80px; background:linear-gradient(135deg, #121212, #1C1C1E); display:flex; align-items:center; justify-content:center; }
  .default-monogram { width:40px; height:40px; border-radius:12px; background:var(--gold-dim); border:1px solid rgba(212,175,55,0.3); display:flex; align-items:center; justify-content:center; }
  
  .card-body { padding:16px; display:flex; flex-direction:column; gap:4px; position:relative; }
  .card-acts { position:absolute; right:16px; top:-20px; display:flex; gap:6px; z-index:10; }
  .card-act-btn { width:36px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:14px; border:1px solid var(--border); background:var(--surface); color:var(--sub); box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition:all 0.2s;}
  .card-act-btn:active { background:var(--gold-dim); color:var(--gold); border-color:var(--gold); }
  
  .card-name { font-size:20px; font-weight:700; color:var(--text); line-height:1.2; padding-right:60px;}
  .card-co { font-size:13px; color:var(--gold); font-weight:600; letter-spacing:0.5px; margin-top:2px; }
  .card-title { font-size:13px; color:var(--sub); margin-bottom:8px; }
  
  .card-contacts { display:flex; flex-wrap:wrap; gap:6px; }
  .contact-pill { display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,0.06); font-size:12px; color:var(--text); font-weight:500; border:0.5px solid var(--border);}
  .contact-pill .ic { font-size:11px; opacity:0.7; }

  /* ── Native Bottom Navigation ── */
  .nav { position:fixed; bottom:0; left:0; right:0; z-index:200; height:calc(var(--navh) + env(safe-area-inset-bottom, 20px)); background:rgba(18,18,18,0.85); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); border-top:0.5px solid var(--border); display:flex; align-items:flex-start; padding-top:10px; padding-bottom:env(safe-area-inset-bottom, 20px); }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:none; border:none; color:var(--muted); font-size:10px; font-weight:600; gap:4px; transition:color 0.2s; }
  .nav-btn .ni { font-size:22px; transition:transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .nav-btn.on { color:var(--gold); }
  .nav-btn.on .ni { transform:translateY(-2px); }
  
  /* FAB 스타일 스캔 버튼 SVG 아이콘화 */
  .nav-shoot { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; top:-22px; }
  .shoot-orb { width:56px; height:56px; border-radius:22px; background:linear-gradient(135deg, var(--gold), #9A7530); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px var(--gold-dim); border:4px solid var(--bg); transition:transform 0.15s; }
  .nav-shoot:active .shoot-orb { transform:scale(0.9); }
  .shoot-lbl { font-size:10px; font-weight:700; color:var(--gold); margin-top:4px; }

  /* ── Bottom Sheet (Modals) ── */
  .ovl { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); align-items:flex-end; opacity:0; transition:opacity 0.3s; }
  .ovl.on { display:flex; opacity:1; }
  .sheet { width:100%; background:var(--bg-elevated); border-radius:24px 24px 0 0; max-height:92vh; overflow-y:auto; padding-bottom:calc(20px + env(safe-area-inset-bottom, 20px)); transform:translateY(100%); transition:transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); box-shadow:0 -10px 40px rgba(0,0,0,0.5); border-top:0.5px solid var(--border-light);}
  .ovl.on .sheet { transform:translateY(0); }
  .drag-handle { width:36px; height:5px; background:var(--surface-hover); border-radius:3px; margin:10px auto; }
  
  .sh-head { display:flex; align-items:center; justify-content:space-between; padding:10px 20px 16px; position:sticky; top:0; background:var(--bg-elevated); z-index:10; }
  .sh-title { font-size:18px; font-weight:700; color:var(--text); }
  .sh-x { width:30px; height:30px; border-radius:50%; background:var(--surface); color:var(--sub); border:none; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:bold; }

  /* ── Detail View (Grouped iOS Style) ── */
  .det-hero { margin:0 20px 20px; border-radius:20px; overflow:hidden; background:var(--surface); aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; border:0.5px solid var(--border);}
  .det-hero img { width:100%; height:100%; object-fit:cover; }
  
  .det-profile { text-align:center; padding:0 20px 20px; }
  .dp-name { font-size:28px; font-weight:700; color:var(--text); margin-bottom:4px; letter-spacing:-0.5px; }
  .dp-co { font-size:14px; color:var(--sub); font-weight:500; }
  
  /* Quick Actions Row */
  .quick-actions { display:flex; justify-content:center; gap:16px; padding:0 20px 24px; }
  .qa-btn { display:flex; flex-direction:column; align-items:center; gap:6px; text-decoration:none; width:64px; }
  .qa-ic-wrap { width:46px; height:46px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:20px; border:0.5px solid var(--border); transition:background 0.2s;}
  .qa-btn:active .qa-ic-wrap { background:var(--surface-hover); }
  .qa-btn.call .qa-ic-wrap { color:#30D158; background:rgba(48,209,88,0.1); border-color:rgba(48,209,88,0.2);}
  .qa-btn.sms .qa-ic-wrap { color:#0A84FF; background:rgba(10,132,255,0.1); border-color:rgba(10,132,255,0.2);}
  .qa-btn.mail .qa-ic-wrap { color:#FF9F0A; background:rgba(255,159,10,0.1); border-color:rgba(255,159,10,0.2);}
  .qa-lbl { font-size:11px; color:var(--sub); font-weight:500; }

  /* Info Group Box */
  .info-group-wrap { padding:0 20px; }
  .info-group { background:var(--surface); border-radius:16px; overflow:hidden; border:0.5px solid var(--border); margin-bottom:20px; }
  .ig-item { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:0.5px solid var(--border); text-decoration:none; }
  .ig-item:last-child { border-bottom:none; }
  .ig-left { display:flex; flex-direction:column; gap:2px; }
  .ig-lbl { font-size:11px; color:var(--muted); }
  .ig-val { font-size:15px; color:var(--text); font-weight:500; }
  .ig-act { font-size:14px; color:var(--sub); }
  
  .det-ctrl-row { display:flex; gap:12px; padding:0 20px 20px; }

  /* Forms & Buttons */
  .field-group { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field-label { font-size:12px; color:var(--sub); padding-left:4px; font-weight:500;}
  .field-input { width:100%; background:var(--surface); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; color:var(--text); font-size:16px; outline:none; transition:border-color 0.2s; }
  .field-input:focus { border-color:var(--gold); }
  
  .btn-primary { width:100%; padding:16px; background:linear-gradient(135deg, var(--gold), #9A7530); color:#000; font-size:16px; font-weight:700; border:none; border-radius:14px; cursor:pointer; box-shadow:0 4px 12px var(--gold-dim); transition:transform 0.1s; }
  .btn-primary:active { transform:scale(0.96); }
  .btn-secondary { width:100%; padding:16px; background:var(--surface); color:var(--text); font-size:16px; font-weight:600; border:0.5px solid var(--border); border-radius:14px; cursor:pointer; transition:background 0.1s; }
  .btn-secondary:active { background:var(--surface-hover); }

  /* ── Camera Modal ── */
  .cam-container { margin:0 20px; border-radius:20px; overflow:hidden; background:#000; aspect-ratio:3/4; position:relative; border:0.5px solid var(--border); }
  #camVideo, #previewImg { width:100%; height:100%; object-fit:cover; display:block; }
  .cam-overlay { position:absolute; inset:16px; border:1.5px solid rgba(212,175,55,0.4); border-radius:12px; pointer-events:none; }
  .cam-overlay::before, .cam-overlay::after { content:''; position:absolute; width:24px; height:24px; border-color:var(--gold); border-style:solid; }
  .cam-overlay::before { top:-2px; left:-2px; border-width:3px 0 0 3px; border-radius:6px 0 0 0; }
  .cam-overlay::after { bottom:-2px; right:-2px; border-width:0 3px 3px 0; border-radius:0 0 6px 0; }
  
  .cam-acts-wrap { padding:20px; display:flex; flex-direction:column; gap:12px; }
  .cam-row { display:flex; gap:10px; }
  .gallery-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px; background:transparent; color:var(--gold); font-size:14px; font-weight:600; border:1px dashed var(--gold-glow); border-radius:12px; cursor:pointer; }
  .gallery-btn:active { background:var(--gold-dim); }

  /* Timeline */
  .timeline-wrap { margin-bottom:20px; }
  .timeline-title { font-size:13px; color:var(--gold); font-weight:600; margin-bottom:12px; padding:0 4px;}
  .timeline { border-left:2px solid var(--surface-hover); padding-left:16px; margin-left:6px; display:flex; flex-direction:column; gap:16px; }
  .timeline-item { position:relative; }
  .timeline-item::before { content:''; position:absolute; left:-21px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 3px var(--bg-elevated); }
  .tl-date { font-size:10px; color:var(--muted); margin-bottom:2px; font-weight:500; }
  .tl-company { font-size:14px; color:var(--text); font-weight:600; line-height:1.3;}
  .tl-title { font-size:12px; color:var(--sub); }

  /* Alert Modals */
  .alert-bg { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:24px; opacity:0; transition:opacity 0.2s; }
  .alert-bg.on { display:flex; opacity:1; }
  .alert-box { background:var(--surface); border-radius:20px; width:100%; max-width:300px; text-align:center; padding:24px; box-shadow:0 20px 40px rgba(0,0,0,0.5); border:0.5px solid var(--border); transform:scale(0.95); transition:transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .alert-bg.on .alert-box { transform:scale(1); }
  .alert-icon { font-size:36px; margin-bottom:12px; }
  .alert-msg { font-size:14px; color:var(--text); line-height:1.5; margin-bottom:24px; font-weight:500; }

  /* Skeleton Loading */
  .skeleton { background:var(--bg-elevated); border-radius:20px; height:180px; position:relative; overflow:hidden; border:0.5px solid var(--border); }
  .skeleton::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent); animation:shimmer 1.5s infinite; }
  @keyframes shimmer { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="brand"><span class="brand-name">CardVault</span></div>
    <div class="hdr-acts">
      <div class="count-pill"><b id="totalCount">-</b> Cards</div>
      <button class="set-btn" onclick="openOvl('setOvl')">⚙️</button>
    </div>
  </div>
  
  <div class="search-row">
    <div class="search-box">
      <span class="search-ic">🔍</span>
      <input type="text" id="searchInput" placeholder="이름, 회사, 번호 검색">
    </div>
  </div>
  
  <div class="filter-chips">
    <button class="chip on" onclick="doFilter('all',this)">전체보기</button>
    <button class="chip" onclick="doFilter('recent',this)">최근 7일</button>
  </div>

  <div class="consonant-bar">
    <button class="c-btn on" onclick="filterByChosung('all', this)">All</button>
    <button class="c-btn" onclick="filterByChosung('ㄱ', this)">ㄱ</button>
    <button class="c-btn" onclick="filterByChosung('ㄴ', this)">ㄴ</button>
    <button class="c-btn" onclick="filterByChosung('ㄷ', this)">ㄷ</button>
    <button class="c-btn" onclick="filterByChosung('ㄹ', this)">ㄹ</button>
    <button class="c-btn" onclick="filterByChosung('ㅁ', this)">ㅁ</button>
    <button class="c-btn" onclick="filterByChosung('ㅂ', this)">ㅂ</button>
    <button class="c-btn" onclick="filterByChosung('ㅅ', this)">ㅅ</button>
    <button class="c-btn" onclick="filterByChosung('ㅇ', this)">ㅇ</button>
    <button class="c-btn" onclick="filterByChosung('ㅈ', this)">ㅈ</button>
    <button class="c-btn" onclick="filterByChosung('ㅊ', this)">ㅊ</button>
    <button class="c-btn" onclick="filterByChosung('ㅋ', this)">ㅋ</button>
    <button class="c-btn" onclick="filterByChosung('ㅌ', this)">ㅌ</button>
    <button class="c-btn" onclick="filterByChosung('ㅍ', this)">ㅍ</button>
    <button class="c-btn" onclick="filterByChosung('ㅎ', this)">ㅎ</button>
    <button class="c-btn" onclick="filterByChosung('etc', this)">A-Z</button>
  </div>
</header>

<div id="app"></div>

<nav class="nav">
  <button class="nav-btn on" onclick="doFilter('all',this)">
    <span class="ni">🪪</span><span>연락처</span>
  </button>
  <div class="nav-shoot" onclick="openUpload()">
    <div class="shoot-orb">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    </div>
    <span class="shoot-lbl">스캔</span>
  </div>
  <button class="nav-btn" onclick="openStatsModal()">
    <span class="ni">📊</span><span>통계</span>
  </button>
</nav>

<!-- ── Bottom Sheets ── -->

<!-- Detail Modal -->
<div class="ovl" id="detOvl">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sh-head">
      <span class="sh-title">명함 상세</span>
      <button class="sh-x" onclick="closeOvl('detOvl')">✕</button>
    </div>
    <div id="detContent"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="ovl" id="editOvl">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sh-head">
      <span class="sh-title">명함 편집</span>
      <button class="sh-x" onclick="closeOvl('editOvl')">✕</button>
    </div>
    <div id="editContent"></div>
  </div>
</div>

<!-- Stats Modal -->
<div class="ovl" id="statsModal">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sh-head">
      <span class="sh-title">데이터 인사이트</span>
      <button class="sh-x" onclick="closeOvl('statsModal')">✕</button>
    </div>
    <div style="padding:0 20px 40px; display:flex; flex-direction:column; gap:20px;">
      <div style="background:var(--surface); padding:20px; border-radius:20px; border:0.5px solid var(--border);">
        <div style="font-size:13px; color:var(--gold); font-weight:600; margin-bottom:16px; text-align:center;">주요 성씨 분포 (Top 5)</div>
        <div style="height:200px; position:relative;"><canvas id="lastNameChart"></canvas></div>
      </div>
      <div style="background:var(--surface); padding:20px; border-radius:20px; border:0.5px solid var(--border);">
        <div style="font-size:13px; color:var(--gold); font-weight:600; margin-bottom:16px; text-align:center;">회사별 등록 비율 (Top 5)</div>
        <div style="height:200px; position:relative;"><canvas id="companyChart"></canvas></div>
      </div>

</div>

<!-- Native Style Alerts -->
<div class="alert-bg" id="customAlertModal">
  <div class="alert-box">

</div>

<div class="alert-bg" id="customConfirmModal">
  <div class="alert-box">
    <div class="alert-icon">💡</div>
    <div class="alert-msg" id="confirmMessage"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" id="confirmCancelBtn" style="padding:12px;">취소</button>
      <button class="btn-primary" id="confirmOkBtn" style="padding:12px;">삭제</button>

  </div>

<script>
// ── Canonical URL & Routing ──
const SCRIPT_URL = "<?= scriptUrl ?>";
function navigateTo(url) { try { if (window.top && window.top !== window) window.top.location.href = url; else window.location.href = url; } catch(e) { window.location.href = url; } }
function goAdmin() { navigateTo(SCRIPT_URL + '?page=admin'); }
function goDesktop() { try { localStorage.setItem("cv_manual_view", "desktop"); localStorage.setItem("cv_last_view", "desktop"); } catch(e){} navigateTo(SCRIPT_URL + '?v=desktop'); }

// ── Native Alerts ──
function showAlert(msg, isSuccess=false) { document.getElementById('customAlertModal').classList.add('on'); document.getElementById('alertIcon').textContent = isSuccess ? '✅' : '⚠️'; document.getElementById('alertMessage').textContent = msg; document.getElementById('alertOkBtn').onclick = () => document.getElementById('customAlertModal').classList.remove('on'); }
function showConfirm(msg, onOk) { document.getElementById('customConfirmModal').classList.add('on'); document.getElementById('confirmMessage').textContent = msg; document.getElementById('confirmOkBtn').onclick = () => { document.getElementById('customConfirmModal').classList.remove('on'); onOk(); }; document.getElementById('confirmCancelBtn').onclick = () => document.getElementById('customConfirmModal').classList.remove('on'); }

// ── Formatters & Fallbacks ──
function autoHyphen(target) { target.value = target.value.replace(/[^0-9]/g, '').replace(/^(\d{2,3})(\d{3,4})(\d{4})$/, `$1-$2-$3`).replace(/(\-{1,2})$/g, ""); }
function hasValidImage(url) { if (!url) return false; const u = String(url).trim().toLowerCase(); return u !== '' && u !== 'null' && u !== 'undefined' && u !== 'none'; }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function getDefaultBanner() {
  return `<div class="card-banner-default"><div class="default-monogram"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div></div>`;
}
window.handleImgError = function(el) { el.outerHTML = getDefaultBanner(); };

function getChosung(str) {
  if (!str) return ''; const charCode = str.charCodeAt(0) - 44032;
  if (charCode < 0 || charCode > 11171) return 'etc'; 
  const cho = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const res = cho[Math.floor(charCode / 588)];
  const normalize = {'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
  return normalize[res] || res;
}

// ── State & Data ──
let ALL = [], CUR = 'all', currentChosung = 'all', searchTimeout = null;
let chart1 = null, chart2 = null;

window.addEventListener('load', () => {
  try { localStorage.setItem("cv_last_view", "mobile"); } catch(e) {}
  showSkeleton();
  
  google.script.run.withSuccessHandler(cards => { 
    ALL = cards; 
    document.getElementById('totalCount').textContent = cards.length;
    doFilter(CUR, null); 
  }).getNamecards();

  google.script.run.withSuccessHandler(u => { 
    if (u && u.role === 'admin') document.getElementById('adminMenu').style.display = 'flex'; 
  }).getCurrentUser();
});

function showSkeleton() {
  const skelHtml = Array(3).fill().map(()=>`<div class="skeleton"><div class="sk-img"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line short"></div></div></div>`).join('');
  document.getElementById('app').innerHTML = `<div class="card-list">${skelHtml}</div>`;
}

document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doFilter(CUR, null), 300);
});

function filterByChosung(cho, el) {
  currentChosung = cho;
  if(el) { document.querySelectorAll('.c-btn').forEach(b => b.classList.remove('on')); el.classList.add('on'); }
  doFilter(CUR, null);
}

function doFilter(type, el) {
  CUR = type;
  let cards = ALL;
  
  if (type === 'recent') { const cut = Date.now() - 7 * 24 * 60 * 60 * 1000; cards = cards.filter(c => new Date(c.createdAt).getTime() > cut); }
  
  if (currentChosung !== 'all') {
    cards = cards.filter(c => {
      if (!c.name) return currentChosung === 'etc';
      const initial = getChosung(c.name);
      return currentChosung === 'etc' ? initial === 'etc' : initial === currentChosung;
    });
  }

  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (q) cards = cards.filter(c => [c.name, c.company, c.title, c.phone, c.mobile, c.email].some(v => v && v.toLowerCase().includes(q)));
  
  if (el) { document.querySelectorAll('.chip').forEach(b => b.classList.remove('on')); el.classList.add('on'); }
  
  const app = document.getElementById('app');
  if (!cards.length) { app.innerHTML = '<div style="text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;">조건에 맞는 명함이 없습니다.</div>'; return; }
  
  app.innerHTML = '<div class="card-list">' + cards.map(c => {
    let badgeHtml = '';
    if (c.status === 'NEW') badgeHtml = '<div class="status-badge badge-new">NEW</div>';
    else if (c.status === 'CAREER_CHANGED') badgeHtml = '<div class="status-badge badge-change">UPDATED</div>';
    
    const mediaHtml = hasValidImage(c.imageUrl) 
      ? getDefaultBanner() 
      : getDefaultBanner();
    
    return `
      <div class="card" onclick="openDet(${c.index})">
        ${badgeHtml}
        <div class="card-banner">${mediaHtml}</div>
        <div class="card-body">
          <div class="card-acts"><button class="card-act-btn" onclick="event.stopPropagation();openEdit(${c.index})">✏️</button></div>
          <div class="card-name">${escHtml(c.name||'이름 없음')}</div>
          <div class="card-co">${escHtml(c.company)}</div>
          <div class="card-title">${escHtml(c.title)}</div>
          <div class="card-contacts">
            ${c.mobile ? `<span class="contact-pill"><span class="ic">📱</span>${escHtml(c.mobile)}</span>` : ''}
            ${c.phone ? `<span class="contact-pill"><span class="ic">📞</span>${escHtml(c.phone)}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('') + '</div>';
}

function openDet(idx) {
  const c = ALL.find(x => x.index === idx); if (!c) return;
  
  const mediaHtml = hasValidImage(c.imageUrl) 
    ? `<span id="detImgBox">${getDefaultBanner()}</span>` 
    : getDefaultBanner();

  let historyHtml = '';
  if (c.history && c.history.length > 0) {
    historyHtml = `
      <div class="timeline-wrap">
        <div class="timeline-title">커리어 이력</div>
        <div class="info-group" style="padding:16px 0; margin-bottom:0;">
          <div class="timeline">
            ${c.history.map(h => `
              <div class="timeline-item">
                <div class="tl-date">${new Date(h.date).toLocaleDateString('ko-KR')}</div>
                <div class="tl-company">${escHtml(h.oldCompany)} <span style="color:var(--muted)">➔</span> <b style="color:var(--gold)">${escHtml(h.newCompany)}</b></div>
                <div class="tl-title">${escHtml(h.oldTitle)} ➔ ${escHtml(h.newTitle)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById('detContent').innerHTML = `
    <div class="det-hero">${mediaHtml}</div>
    <div class="det-profile">
      <div class="dp-name">${escHtml(c.name||'이름 없음')}</div>
      <div class="dp-co">${escHtml(c.company)} ${c.title ? '• '+escHtml(c.title) : ''}</div>
    </div>
    
    <div class="quick-actions">
      ${c.mobile ? `<a href="tel:${escHtml(c.mobile)}" class="qa-btn call"><div class="qa-ic-wrap">📞</div><span class="qa-lbl">통화</span></a>` : ''}
      ${c.mobile ? `<a href="sms:${escHtml(c.mobile)}" class="qa-btn sms"><div class="qa-ic-wrap">💬</div><span class="qa-lbl">문자</span></a>` : ''}
      ${c.email ? `<a href="mailto:${escHtml(c.email)}" class="qa-btn mail"><div class="qa-ic-wrap">✉️</div><span class="qa-lbl">메일</span></a>` : ''}
    </div>

    <div class="info-group-wrap">
      <div class="info-group">
        ${c.mobile ? `<a href="tel:${escHtml(c.mobile)}" class="ig-item"><div class="ig-left"><span class="ig-lbl">휴대전화</span><span class="ig-val">${escHtml(c.mobile)}</span></div></a>` : ''}
        ${c.phone ? `<a href="tel:${escHtml(c.phone)}" class="ig-item"><div class="ig-left"><span class="ig-lbl">일반전화</span><span class="ig-val">${escHtml(c.phone)}</span></div></a>` : ''}
        ${c.email ? `<a href="mailto:${escHtml(c.email)}" class="ig-item"><div class="ig-left"><span class="ig-lbl">이메일</span><span class="ig-val">${escHtml(c.email)}</span></div></a>` : ''}
        ${c.address ? `<div class="ig-item"><div class="ig-left"><span class="ig-lbl">주소</span><span class="ig-val" style="font-size:13px;">${escHtml(c.address)}</span></div></div>` : ''}
      </div>
      ${historyHtml}
    </div>
    
    <div class="det-ctrl-row">
      <button class="btn-secondary" style="flex:1;" onclick="openEdit(${c.index})">정보 수정</button>
      <button class="btn-secondary" style="color:var(--danger); border-color:var(--danger); flex:0.4;" onclick="delCard(${c.index})">삭제</button>
    </div>
  `;
  openOvl('detOvl'); if (hasValidImage(c.imageUrl)) google.script.run.withSuccessHandler(function(d){ var b=document.getElementById('detImgBox'); if(b&&d) b.innerHTML='<img src="'+d+'">'; }).withFailureHandler(function(){}).getNamecardImage(c.imageUrl);
}

function openEdit(idx) {
  const c = ALL.find(x => x.index === idx); if (!c) return;
  document.getElementById('editContent').innerHTML = `
    <div style="padding:0 20px 24px;">
      ${fld('company','회사명',c.company)}
      ${fld('name','이름',c.name)}
      ${fld('title','직책',c.title)}
      <div class="field-group"><label class="field-label">휴대폰 번호</label><input class="field-input" id="f_mobile" type="tel" value="${escHtml(c.mobile||'')}" oninput="autoHyphen(this)" maxlength="13"></div>
      <div class="field-group"><label class="field-label">일반 전화</label><input class="field-input" id="f_phone" type="tel" value="${escHtml(c.phone||'')}" oninput="autoHyphen(this)" maxlength="13"></div>
      ${fld('email','이메일',c.email)}
      ${fld('address','주소',c.address)}
      <div style="display:flex; gap:12px; margin-top:24px;">
        <button onclick="closeOvl('editOvl')" class="btn-secondary" style="flex:0.6;">취소</button>
        <button onclick="saveEdit(${idx})" class="btn-primary" style="flex:1;">저장 완료</button>
      </div>
    </div>`;
  closeOvl('detOvl'); openOvl('editOvl');
}
function fld(id, label, val) { return `<div class="field-group"><label class="field-label">${label}</label><input class="field-input" id="f_${id}" type="text" value="${escHtml(val||'')}"></div>`; }

function saveEdit(idx) {
  const d = { company: document.getElementById('f_company').value, name: document.getElementById('f_name').value, title: document.getElementById('f_title').value, phone: document.getElementById('f_phone').value, mobile: document.getElementById('f_mobile').value, email: document.getElementById('f_email').value, address: document.getElementById('f_address').value };
  google.script.run.withSuccessHandler(() => { closeOvl('editOvl'); showSkeleton(); google.script.run.withSuccessHandler(cards => { ALL = cards; doFilter(CUR, null); }).getNamecards(); }).withFailureHandler(err => showAlert('저장 실패: ' + err.message)).updateNamecard(idx, d, (ALL.find(c => c.index === idx)||{}).id);
}

function delCard(idx) { 
  showConfirm("명함을 영구적으로 삭제할까요?", () => { 
    closeOvl('detOvl'); showSkeleton();
    google.script.run.withSuccessHandler(()=>{ 
      showAlert('삭제되었습니다.', true); google.script.run.withSuccessHandler(cards => { ALL = cards; doFilter(CUR, null); }).getNamecards(); 
    }).withFailureHandler(err => { showAlert('삭제 실패: ' + err.message); google.script.run.withSuccessHandler(cards => { ALL = cards; doFilter(CUR, null); }).getNamecards(); }).deleteNamecard(idx, (ALL.find(c => c.index === idx)||{}).id); 
  }); 
}

function openStatsModal() { openOvl('statsModal'); setTimeout(renderCharts, 150); }

function renderCharts() {
  const lastNameCount = {}; const companyCount = {};
  ALL.forEach(c => {
    if (c.name) { const ln = c.name.trim().charAt(0); if (/[가-힣]/.test(ln)) lastNameCount[ln] = (lastNameCount[ln] || 0) + 1; }
    if (c.company) { const comp = c.company.trim(); companyCount[comp] = (companyCount[comp] || 0) + 1; }
  });
  const sortedNames = Object.entries(lastNameCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const sortedComps = Object.entries(companyCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const colors = ['#D4AF37', '#B6922D', '#997824', '#7D601C', '#624A15'];
  const chartOptions = { responsive: true, maintainAspectRatio: false, color: '#EBEBF599', plugins: { legend: { labels: { color: '#EBEBF599', font: { family: "'Pretendard', sans-serif" } } } } };

  if(chart1) chart1.destroy();
  chart1 = new Chart(document.getElementById('lastNameChart'), { type: 'doughnut', data: { labels: sortedNames.map(x=>x[0]+'씨'), datasets: [{ data: sortedNames.map(x=>x[1]), backgroundColor: colors, borderColor: '#1C1C1E', borderWidth: 2 }] }, options: { ...chartOptions, cutout: '65%' } });

  if(chart2) chart2.destroy();
  chart2 = new Chart(document.getElementById('companyChart'), { type: 'bar', data: { labels: sortedComps.map(x=>x[0]), datasets: [{ label: '등록 명함 수', data: sortedComps.map(x=>x[1]), backgroundColor: '#D4AF37', borderRadius: 6 }] }, options: { ...chartOptions, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1 } }, x: { grid: { display: false } } } } });
}

function openOvl(id) { document.getElementById(id).classList.add('on'); }
function closeOvl(id) { document.getElementById(id).classList.remove('on'); }

// ── Camera & Gallery Logic ──
let stream=null, facingMode='environment', capturedB64=null, capturedMime='image/jpeg';

async function openUpload() { 
  openOvl('camOvl'); 
  document.getElementById('camWrap').style.display='block'; 
  document.getElementById('camPerm').style.display='none'; 
  document.getElementById('previewWrap').style.display='none'; 
  document.getElementById('actShoot').style.display='flex'; 
  document.getElementById('actConfirm').style.display='none'; 
  document.getElementById('galleryLabel').style.display='flex'; 
  capturedB64=null; 
  var _b = document.getElementById('btnUploadSubmit');
  if (_b) { _b.innerHTML = '\u2b06 \uc2a4\uce94 \ubc0f \uc5c5\ub85c\ub4dc'; _b.style.pointerEvents = 'auto'; }
  await startCam(); 
}

async function startCam() { document.getElementById('camWrap').style.display='none'; document.getElementById('camPerm').style.display='none'; }

async function retryCamera() { await startCam(); }
function loadFromFile(input) { 
  const file=input.files[0]; if(!file)return; 
  const reader=new FileReader(); 
  reader.onload=e=>{ 
    const url=e.target.result; var im=new Image(); im.onload=function(){ var mx=3000, w=im.width, h=im.height; if(w>mx||h>mx){ var r=Math.min(mx/w,mx/h); w=Math.round(w*r); h=Math.round(h*r); } var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); capturedB64=cv.toDataURL('image/jpeg',0.92).split(',')[1]; capturedMime='image/jpeg'; document.getElementById('previewImg').src='data:image/jpeg;base64,'+capturedB64; switchToPreview(); }; im.src=url; }; reader.readAsDataURL(file); input.value = ''; }

function switchToPreview() {
  document.getElementById('camWrap').style.display='none'; 
  document.getElementById('camPerm').style.display='none'; 
  document.getElementById('previewWrap').style.display='block'; 
  document.getElementById('actShoot').style.display='none'; 
  document.getElementById('actConfirm').style.display='flex'; 
  document.getElementById('galleryLabel').style.display='none'; 
  stopCam(); 
}

function retake() { 
  document.getElementById('camWrap').style.display='block'; 
  document.getElementById('previewWrap').style.display='none'; 
  document.getElementById('actShoot').style.display='flex'; 
  document.getElementById('actConfirm').style.display='none'; 
  document.getElementById('galleryLabel').style.display='flex'; 
  capturedB64=null; 
  var _b = document.getElementById('btnUploadSubmit');
  if (_b) { _b.innerHTML = '\u2b06 \uc2a4\uce94 \ubc0f \uc5c5\ub85c\ub4dc'; _b.style.pointerEvents = 'auto'; }
  startCam(); 
}

function uploadPhoto() { 
  if(!capturedB64)return; 
  const btn = document.getElementById('btnUploadSubmit');
  btn.innerHTML = '<span class="loading-ring" style="width:20px;height:20px;border-width:2px; border-top-color:#000;"></span> 처리 중...';
  btn.style.pointerEvents = 'none';
  
  google.script.run.withSuccessHandler(()=>{ 
    btn.innerHTML = '✅ 업로드 완료!';
    setTimeout(()=>{ 
      closeUpload(); showSkeleton(); 
      google.script.run.withSuccessHandler(cards => { ALL = cards; doFilter(CUR, null); document.getElementById('totalCount').textContent = cards.length; }).withFailureHandler(e=>{ document.getElementById('app').innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted);font-size:14px;">목록을 불러오지 못했습니다.<br>새로고침해 주세요.</div>'; showAlert('목록 갱신 실패: ' + e.message); }).getNamecards(); 
    }, 1500); 
  }).withFailureHandler(err=>{
    showAlert('업로드 실패: ' + err.message);
    btn.innerHTML = '⬆ 스캔 및 업로드';
    btn.style.pointerEvents = 'auto';
  }).uploadToDrive(capturedB64, capturedMime, `namecard_${Date.now()}.jpg`); 
}

function closeUpload() { stopCam(); closeOvl('camOvl'); }
function stopCam() { if (stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; } }
</script>
